<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento via PIX</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ÍCONE PIX -->
        <div class="pix-icon">
            PIX
        </div>


        <!-- TÍTULO -->
        <h1>
            Pagamento via PIX
        </h1>


        <!-- DESCRIÇÃO -->
        <p class="descricao">
            Confira os dados abaixo antes de realizar o pagamento.
        </p>


        <!-- BENEFICIÁRIO -->
        <div class="campo">

            <label>
                Beneficiário
            </label>

            <div class="caixa">

                <span>
                    D PRINT COMUNICAÇÃO VISUAL LTDA
                </span>

            </div>

        </div>


        <!-- TIPO DE CHAVE -->
        <div class="campo">

            <label>
                Tipo de chave
            </label>

            <div class="caixa">

                <span>
                    CNPJ
                </span>

            </div>

        </div>


        <!-- CHAVE PIX -->
        <div class="campo">

            <label>
                Chave PIX
            </label>

            <div class="chave">

                <span id="chavePix" class="chave-texto">
                    39.494.949/0001-20
                </span>


                <!-- BOTÃO SOMENTE COM ÍCONE -->
                <button
                    type="button"
                    onclick="copiarPix()"
                    aria-label="Copiar chave PIX"
                    title="Copiar chave PIX"
                >

                    <!-- ÍCONE COPIAR -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="9"
                            y="9"
                            width="13"
                            height="13"
                            rx="2"
                            ry="2"
                        ></rect>

                        <path
                            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                        ></path>

                    </svg>

                </button>

            </div>

        </div>


        <!-- BANCO -->
        <div class="campo">

            <label>
                Banco de destino
            </label>

            <div class="caixa">

                <span>
                    BANCO DO BRADESCO
                </span>

            </div>

        </div>


        <!-- MENSAGEM -->
        <div id="mensagem"></div>


    </div>


    <script src="script.js"></script>

</body>

</html>
