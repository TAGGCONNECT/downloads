<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento via PIX</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

<div class="container">

    <div class="icon">
        💳
    </div>

    <h1>Pagamento via PIX</h1>

    <p class="subtitle">
        Confira os dados antes de realizar a transferência.
    </p>

    <div class="card">

        <div class="campo">
            <span>Beneficiário</span>
            <strong id="beneficiario"></strong>
        </div>

       <div class="campo">

    <label>Chave PIX</label>

    <div class="chave">

        <span class="chave-texto" id="chavePix">
            39.499.949/0001-20
        </span>

        <button onclick="copiarPix()" aria-label="Copiar chave PIX">
            <i class="fa-regular fa-copy"></i>
        </button>

    </div>

</div>

<div id="mensagem"></div>

        <div class="campo">
            <span>Banco</span>
            <strong id="banco"></strong>
        </div>

    </div>

    <button
        class="whatsapp"
        onclick="abrirWhatsapp()">

        Enviar comprovante

    </button>

</div>

</body>
</html>
