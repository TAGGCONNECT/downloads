<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conecte-se ao Wi-Fi</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="script.js" defer></script>

</head>

<body>

<div class="container">

<div class="wifi-icon">

<i class="fa-solid fa-wifi"></i>

</div>

<h1>Conecte-se ao Wi-Fi</h1>

<p class="descricao">
Copie nossa senha para acessar a rede.
</p>

<div class="campo">

    <label>Chave PIX</label>

    <div class="chave">

        <span class="chave-texto" id="chavePix">
            SUA-CHAVE-PIX-AQUI
        </span>

        <button onclick="copiarPix()" aria-label="Copiar chave PIX">
            <i class="fa-regular fa-copy"></i>
        </button>

    </div>

</div>

<div id="mensagem"></div>
